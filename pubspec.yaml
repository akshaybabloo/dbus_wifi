name: dbus_wifi
description: |
  A simple library to connect to Wi-Fi networks and run Bluetooth LE peripherals using D-Bus (NetworkManager and BlueZ) on Linux.
  This library is intended for use with the dbus package in Dart and Flutter.
version: 0.2.0
repository: https://github.com/akshaybabloo/dbus_wifi

environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  linux:

dependencies:
  dbus: ^0.8.0
  dart_console: ">=4.1.2 <6.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2

executables:
  dbus-wifi: dbus_wifi
  dbus-bluetooth: dbus_bluetooth
